<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wohnung von oben</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<!-- 3D-Ansicht des Rundgangs. Wird vom Rundgang in einem iframe geladen (postMessage). Quelle: 3d-quellen/ -->
<style>
:root{--bg:#eef0ea;--ink:#1f3329;--ring:#1fa38a;--ring2:#fff;--panel:#fffffff0;--line:#c9d1c5;--warn:#b4531a}
@media (prefers-color-scheme:dark){:root{--bg:#1b2420;--ink:#e8efe9;--panel:#26332cf0;--line:#3b4a41}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}
#viewer{position:fixed;inset:0;touch-action:none}
canvas{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.pin svg.ring{width:30px;height:30px;display:block;overflow:visible;filter:drop-shadow(0 1px 3px #0005);transition:transform .15s}
.pin svg.ring .band{fill:none;stroke:#F2EFED;stroke-width:5;stroke-opacity:.96}
.pin svg.ring .disc{fill:#F2EFED;fill-opacity:.85}
.pin svg.ring use{fill:#253C28}
.pin:hover svg.ring,.pin:focus-visible svg.ring{transform:scale(1.2)}
.pin span{margin-top:2px;font-size:10px;font-weight:600;background:var(--panel);padding:1px 6px;border-radius:9px;white-space:nowrap;opacity:0;transition:opacity .15s}
.pin:hover span,.pin:focus-visible span,body.labels .pin span,.pin.sel span{opacity:1}
.pin.sel svg.ring .band{stroke:#e0a21b}
.pin.todo svg.ring .band{stroke:#e0a21b;stroke-dasharray:5 3}
.bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;max-width:calc(100% - 32px)}
.bar button{font:inherit;border:1px solid var(--line);background:transparent;color:inherit;border-radius:9px;padding:7px 12px;cursor:pointer}
.bar button.on{background:var(--ring);color:#fff;border-color:var(--ring)}
.head{position:fixed;left:16px;top:14px;right:16px;pointer-events:none}
.head b{font-size:12px;letter-spacing:.08em;color:var(--ring)}
.head h1{margin:0;font-size:22px}
.info{position:fixed;right:68px;top:14px;max-width:300px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.info[hidden]{display:none}
.info code{display:block;margin-top:4px;word-break:break-all}
#toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg)}
#load[hidden]{display:none}
@media (max-width:600px){.info{top:auto;bottom:96px;left:16px;right:16px;max-width:none}.head h1{font-size:18px}}

#flash{position:fixed;inset:0;background:#F2EFED;opacity:0;pointer-events:none;z-index:5}
#v360{position:fixed;inset:0;z-index:6;display:grid;place-items:center;text-align:center;background:linear-gradient(160deg,#243c31,#4b6a58);color:#F2EFED;padding:24px}
#v360[hidden]{display:none}
#v360 h2{margin:.3em 0;font-size:26px}
#v360 p{max-width:460px;opacity:.85}
#v360 button{margin-top:18px;font:inherit;border:1px solid #F2EFED;background:transparent;color:#F2EFED;border-radius:10px;padding:9px 16px;cursor:pointer}
.dive .pin:not(.tgt){opacity:0;transition:opacity .25s}
:root{--wald:#253C28;--fichte:#BBD034;--dust:#F2EFED}
body{font-family:'Asap Condensed','Segoe UI',Roboto,Arial,sans-serif}
.head b{font-family:inherit;color:var(--wald);opacity:.75}
.head h1{font-family:'Zilla Slab',Georgia,serif;font-weight:500;color:var(--wald)}
.bar button.on{background:var(--wald);border-color:var(--wald);color:var(--dust)}
.bar{background:rgba(242,239,237,.94)}
#bClose{position:fixed;right:16px;top:14px;width:42px;height:42px;border-radius:50%;border:0;background:var(--wald);color:var(--dust);font-size:24px;line-height:1;cursor:pointer;box-shadow:0 2px 8px #0004;z-index:4}
#bClose:hover{background:#34543a}
.pin.cur svg.ring .band{stroke:var(--fichte);stroke-width:6}
.pin.cur span{opacity:1}
</style>
</head>

<div id="viewer"><canvas id="c" aria-label="3D-Modell der Ferienwohnung"></canvas><div id="labels"></div></div>
<div class="head"><b>FERIENWOHNUNG</b><h1>Die Wohnung von oben</h1></div>
<div class="info" id="info" hidden></div>

<button id="bClose" aria-label="3D-Ansicht schließen" title="Schließen">×</button>
<div class="bar" role="toolbar" aria-label="Ansicht">
  <button id="bTop" class="on">Draufsicht</button>

  <button id="bStair" data-edit hidden>Treppe: automatisch</button>

  <button id="bWalls" data-edit hidden>Wände: automatisch</button>
  <button id="bEdit" data-edit hidden>Ports korrigieren</button>
